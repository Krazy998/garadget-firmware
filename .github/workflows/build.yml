name: Build & Test Garadget Local Firmware

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y xxd

      - name: Run host C++17 unit tests
        run: make test

      - name: Cache Particle Device OS 3.3.1 + GCC ARM 10.2.1 toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: garadget-p1-os3.3.1-gcc10.2.1-v1

      - name: Setup local toolchain (if not cached)
        run: make toolchain

      - name: Build Particle P1 firmware (Device OS 3.3.1)
        run: make firmware

      - name: Verify compiled P1 binary header & CRC32
        run: |
          python3 - <<'EOF'
          import struct, zlib
          data = open("target/garadget.bin", "rb").read()
          start, end, _, _, ver, plat, fn, idx = struct.unpack("<IIBBHHBB", data[:16])
          crc_stored = struct.unpack(">I", data[-4:])[0]
          crc_calc = zlib.crc32(data[:-4]) & 0xFFFFFFFF
          assert start == 0x080A0000, f"bad start 0x{start:x}"
          assert end <= 0x080C0000, f"binary exceeds 128KB slot: 0x{end:x}"
          assert (end - start) + 4 == len(data), f"length mismatch: 0x{end-start:x}+4 vs {len(data)}"
          assert plat == 8, f"expected P1 platform 8, got {plat}"
          assert fn == 5, f"expected user-part 5, got {fn}"
          assert crc_stored == crc_calc, "CRC32 mismatch"
          print(f"Verified P1 binary: {len(data)} bytes ({len(data)/1024:.1f} KB), free={0x080C0000-end} B, CRC32=0x{crc_calc:08x}")
          EOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: garadget-p1-firmware
          path: |
            target/garadget.bin
            target/garadget.elf
            target/garadget.hex

      - name: Upload OS binaries for release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: garadget-p1-os-bins
          path: |
            .toolchain/device-os-bins/3.3.1/p1-bootloader@3.3.1+lto.bin
            .toolchain/device-os-bins/3.3.1/p1-system-part1@3.3.1.bin
            .toolchain/device-os-bins/3.3.1/p1-system-part2@3.3.1.bin

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          notes = m.group(1).strip() if m else ""
          with open("/tmp/release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n" if notes else "")
          print("Extracted changelog section:", bool(notes))
          EOF

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          files: |
            release-assets/garadget.bin
            release-assets/p1-bootloader@3.3.1+lto.bin
            release-assets/p1-system-part1@3.3.1.bin
            release-assets/p1-system-part2@3.3.1.bin
